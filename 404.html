<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a2744'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='24' font-weight='900' fill='%23c9a96e' text-anchor='middle'%3ELFP%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable — Les Fraternels Phrygiens</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Source+Serif+4:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Source Serif 4', Georgia, serif;
    background: #1a2744;
    color: #f8f6f1;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
    position: relative;
  }
  body::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: #c0392b;
  }
  body::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 6px;
    background: #c9a96e;
  }
  .contenu { max-width: 560px; }
  .chiffre {
    font-family: 'Playfair Display', serif;
    font-size: clamp(5rem, 18vw, 9rem);
    font-weight: 900;
    color: #c9a96e;
    line-height: 1;
    opacity: 0.85;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.4rem, 4vw, 2rem);
    font-weight: 700;
    margin: 1rem 0 1.25rem;
  }
  p {
    font-size: 1rem;
    line-height: 1.7;
    color: rgba(248,246,241,0.7);
    margin-bottom: 2.5rem;
  }
  .btn-retour {
    display: inline-block;
    background: #c0392b;
    color: white;
    padding: 0.9rem 2.2rem;
    text-decoration: none;
    font-size: 0.95rem;
    letter-spacing: 0.05em;
    transition: background 0.2s;
  }
  .btn-retour:hover { background: #a93226; }
</style>
</head>
<body>
  <div class="contenu">
    <p class="chiffre">404</p>
    <h1>Cette page n'existe pas, ou plus.</h1>
    <p>Le lien que vous avez suivi est peut-être incorrect, ou la page a été déplacée. Retournez à l'accueil pour retrouver le programme des Fraternels Phrygiens.</p>
    <a href="/" class="btn-retour">Retour à l'accueil</a>
  </div>
</body>
</html>
